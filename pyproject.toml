[project]
name = "f1dash"
version = "0.2.0"
description = "Formula 1 session analysis, season overview and live-timing replay dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.1,<4",
    "requests>=2.32,<3",
    "requests-cache>=1.2,<2",
    "pandas>=2.2,<3",
    "numpy>=2.0",
    "gunicorn>=23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["f1dash*"]

[tool.setuptools.package-data]
f1dash = ["templates/**/*", "static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:The 'generic' unit for NumPy timedelta:DeprecationWarning"]
