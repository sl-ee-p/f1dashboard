<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Dashboard</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0f0f0f;
            --surface: #1a1a1a;
            --surface2: #222;
            --border: #2e2e2e;
            --text: #e8e8e8;
            --muted: #888;
            --red: #e10600;
            --red-hover: #ff2018;
            --green: #27ae60;
            --yellow: #f1c40f;
            --soft: #c6c6c6;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 0 0 40px;
            font-size: 14px;
            line-height: 1.5;
        }

        /* ── Header ── */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 28px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-bar {
            width: 4px;
            height: 28px;
            background: var(--red);
            border-radius: 2px;
        }

        .logo h1 {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text);
        }

        .logo span {
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        #session-badge {
            font-size: 12px;
            color: var(--muted);
            max-width: 280px;
            text-align: right;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .live-btn {
            background: #1a3320;
            color: #4ade80;
            border: 1px solid #2d5535;
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            text-decoration: none;
            text-transform: uppercase;
        }

        .live-btn:hover { background: #1f4028; }

        /* ── Controls ── */
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 16px 28px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }

        input[type="number"], input[type="text"], select {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="number"] { width: 90px; }
        input[type="text"] { width: 180px; }
        select { width: 130px; }

        input:focus, select:focus { border-color: var(--red); }

        .load-btn {
            background: var(--red);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: background 0.2s;
        }

        .load-btn:hover { background: var(--red-hover); }
        .load-btn:disabled { background: #555; cursor: not-allowed; }

        #status {
            margin-left: auto;
            font-size: 12px;
            color: var(--muted);
            font-style: italic;
        }

        #status.error { color: #f87171; font-style: normal; }

        /* ── Main layout ── */
        .main { padding: 24px 28px; }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            overflow: hidden;
        }

        .card-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 16px;
        }

        .full { grid-column: span 2; }

        /* ── Tables ── */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead th {
            color: var(--muted);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 0 10px 10px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }

        tbody tr {
            border-bottom: 1px solid #1e1e1e;
            transition: background 0.15s;
        }

        tbody tr:hover { background: var(--surface2); }
        tbody tr:last-child { border-bottom: none; }

        tbody td {
            padding: 10px;
            vertical-align: middle;
        }

        .pos {
            font-weight: 700;
            font-size: 15px;
            color: var(--soft);
            min-width: 28px;
        }

        .pos-1 { color: #f1c40f; }
        .pos-2 { color: #bdc3c7; }
        .pos-3 { color: #cd7f32; }

        .abbr {
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        .team-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }

        .status-tag {
            font-size: 10px;
            padding: 2px 7px;
            border-radius: 4px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .tag-finished { background: #1a2e1a; color: #4ade80; }
        .tag-dnf { background: #2e1a1a; color: #f87171; }
        .tag-other { background: var(--surface2); color: var(--muted); }

        .compound-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 20px;
            letter-spacing: 1px;
        }

        .cpd-SOFT { background: #3a1010; color: #f87171; }
        .cpd-MEDIUM { background: #3a2e00; color: #fbbf24; }
        .cpd-HARD { background: #2a2a2a; color: #e8e8e8; }
        .cpd-INTERMEDIATE { background: #0d2e0d; color: #4ade80; }
        .cpd-WET { background: #0d1a3a; color: #60a5fa; }
        .cpd-UNKNOWN { background: var(--surface2); color: var(--muted); }

        /* ── Chart ── */
        .chart-wrap {
            position: relative;
            height: 320px;
        }

        /* ── Empty state ── */
        .empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 0;
            color: var(--muted);
            gap: 8px;
        }

        .empty-icon {
            font-size: 32px;
            opacity: 0.3;
        }

        .empty p { font-size: 13px; }

        @media (max-width: 768px) {
            .grid-2 { grid-template-columns: 1fr; }
            .full { grid-column: span 1; }
            header { flex-wrap: wrap; gap: 12px; }
            .controls { padding: 12px 16px; }
            .main { padding: 16px; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <div class="logo-bar"></div>
        <div>
            <h1>F1 Dashboard</h1>
            <span>Historical Data</span>
        </div>
    </div>
    <div class="header-right">
        <div id="session-badge">No session loaded</div>
        <a href="/live" class="live-btn">⬤ Live</a>
    </div>
</header>

<div class="controls">
    <input type="number" id="year" value="2023" min="2018" max="2026" placeholder="Year">
    <input type="text" id="gp" value="Monaco" placeholder="GP (e.g. Monaco)">
    <select id="session">
        <option value="R">Race</option>
        <option value="Q">Qualifying</option>
        <option value="S">Sprint</option>
        <option value="FP1">FP1</option>
        <option value="FP2">FP2</option>
        <option value="FP3">FP3</option>
    </select>
    <button class="load-btn" id="load-btn" onclick="loadSession()">Load Session</button>
    <div id="status">Ready</div>
</div>

<div class="main">
    <div class="grid-2">

        <!-- Results -->
        <div class="card">
            <div class="card-title">Race Results</div>
            <div id="results-wrap">
                <div class="empty">
                    <div class="empty-icon">🏁</div>
                    <p>Load a session to see results</p>
                </div>
            </div>
        </div>

        <!-- Tyres -->
        <div class="card">
            <div class="card-title">Tyre Strategy &amp; Best Laps</div>
            <div id="tyre-wrap">
                <div class="empty">
                    <div class="empty-icon">🔴</div>
                    <p>Tyre data will appear here</p>
                </div>
            </div>
        </div>

        <!-- Telemetry -->
        <div class="card full">
            <div class="card-title" id="tel-title">Fastest Lap Telemetry</div>
            <div id="tel-wrap">
                <div class="empty">
                    <div class="empty-icon">📡</div>
                    <p>Telemetry data will appear here</p>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
const socket = io();
let telChart = null;

const TEAM_COLORS = {
    'Red Bull Racing': '#3671C6',
    'Mercedes': '#27F4D2',
    'Ferrari': '#E8002D',
    'McLaren': '#FF8000',
    'Aston Martin': '#229971',
    'Alpine': '#0093CC',
    'Williams': '#64C4FF',
    'AlphaTauri': '#5E8FAA',
    'RB': '#6692FF',
    'Alfa Romeo': '#C92D4B',
    'Haas F1 Team': '#B6BABD',
    'Sauber': '#C92D4B',
};

function teamColor(name) {
    for (const [k, v] of Object.entries(TEAM_COLORS)) {
        if (name && name.includes(k.split(' ')[0])) return v;
    }
    return '#666';
}

socket.on('status', d => {
    const el = document.getElementById('status');
    el.textContent = d.msg;
    el.className = '';
});

socket.on('error', d => {
    const el = document.getElementById('status');
    el.textContent = '⚠ ' + d.msg;
    el.className = 'error';
    document.getElementById('load-btn').disabled = false;
});

socket.on('session_data', d => {
    document.getElementById('session-badge').textContent = d.session_name;
    document.getElementById('load-btn').disabled = false;

    renderResults(d.drivers);
    renderTyres(d.tyres);

    if (d.telemetry) {
        renderTelemetry(d.telemetry);
    } else {
        document.getElementById('tel-wrap').innerHTML = '<div class="empty"><div class="empty-icon">📡</div><p>No telemetry available for this session</p></div>';
    }
});

function loadSession() {
    const btn = document.getElementById('load-btn');
    btn.disabled = true;
    socket.emit('load_session', {
        year: document.getElementById('year').value,
        gp: document.getElementById('gp').value,
        session: document.getElementById('session').value,
    });
}

function renderResults(drivers) {
    if (!drivers.length) return;
    const sorted = [...drivers].sort((a, b) => a.position - b.position);
    let html = '<table><thead><tr><th>Pos</th><th>Driver</th><th>Team</th><th>Grid</th><th>Pts</th><th>Status</th></tr></thead><tbody>';
    sorted.forEach(d => {
        const posClass = d.position <= 3 ? `pos-${d.position}` : '';
        const statusClass = d.status === 'Finished' ? 'tag-finished' : d.status.startsWith('+') ? 'tag-finished' : d.status === 'DNF' || d.status === 'Retired' ? 'tag-dnf' : 'tag-other';
        const color = teamColor(d.team);
        html += `<tr>
            <td class="pos ${posClass}">${d.position || '—'}</td>
            <td><span class="abbr">${d.abbreviation}</span></td>
            <td><span class="team-dot" style="background:${color}"></span>${d.team}</td>
            <td style="color:var(--muted)">${d.grid || '—'}</td>
            <td style="font-weight:600">${d.points || 0}</td>
            <td><span class="status-tag ${statusClass}">${d.status}</span></td>
        </tr>`;
    });
    html += '</tbody></table>';
    document.getElementById('results-wrap').innerHTML = html;
}

function renderTyres(tyres) {
    if (!tyres.length) return;
    const sorted = [...tyres].sort((a, b) => a.driver.localeCompare(b.driver));
    let html = '<table><thead><tr><th>Driver</th><th>Compound</th><th>Best Lap</th><th>Life</th><th>Stints</th></tr></thead><tbody>';
    sorted.forEach(t => {
        const cpd = (t.compound || 'UNKNOWN').toUpperCase().replace(' ', '_');
        html += `<tr>
            <td class="abbr">${t.driver}</td>
            <td><span class="compound-badge cpd-${cpd}">${t.compound || '?'}</span></td>
            <td style="font-family:monospace">${t.lap_time}</td>
            <td style="color:var(--muted)">${t.tyre_life} laps</td>
            <td style="color:var(--muted)">${t.stints || 1}</td>
        </tr>`;
    });
    html += '</tbody></table>';
    document.getElementById('tyre-wrap').innerHTML = html;
}

function renderTelemetry(tel) {
    document.getElementById('tel-title').textContent = `Fastest Lap Telemetry — ${tel.driver}`;
    document.getElementById('tel-wrap').innerHTML = '<div class="chart-wrap"><canvas id="tel-canvas"></canvas></div>';

    if (telChart) { telChart.destroy(); telChart = null; }

    const ctx = document.getElementById('tel-canvas').getContext('2d');
    telChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: tel.distance,
            datasets: [
                {
                    label: 'Speed (km/h)',
                    data: tel.speed,
                    borderColor: '#e10600',
                    backgroundColor: 'transparent',
                    yAxisID: 'ySpeed',
                    borderWidth: 2,
                    pointRadius: 0,
                    tension: 0.1,
                },
                {
                    label: 'Throttle (%)',
                    data: tel.throttle,
                    borderColor: '#4ade80',
                    backgroundColor: 'rgba(74,222,128,0.05)',
                    yAxisID: 'yPedal',
                    borderWidth: 1.5,
                    pointRadius: 0,
                    fill: true,
                    tension: 0.1,
                },
                {
                    label: 'Brake',
                    data: tel.brake.map(b => b ? 100 : 0),
                    borderColor: '#fbbf24',
                    backgroundColor: 'rgba(251,191,36,0.08)',
                    yAxisID: 'yPedal',
                    borderWidth: 1.5,
                    pointRadius: 0,
                    fill: true,
                    tension: 0,
                },
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            interaction: { mode: 'index', intersect: false },
            scales: {
                x: {
                    title: { display: true, text: 'Distance (m)', color: '#666', font: { size: 11 } },
                    ticks: { color: '#555', maxRotation: 0, autoSkip: true, maxTicksLimit: 12 },
                    grid: { color: '#1e1e1e' },
                },
                ySpeed: {
                    type: 'linear',
                    position: 'left',
                    title: { display: true, text: 'Speed (km/h)', color: '#e10600', font: { size: 11 } },
                    ticks: { color: '#555' },
                    grid: { color: '#1e1e1e' },
                },
                yPedal: {
                    type: 'linear',
                    position: 'right',
                    min: 0, max: 110,
                    title: { display: true, text: 'Pedals (%)', color: '#4ade80', font: { size: 11 } },
                    ticks: { color: '#555' },
                    grid: { drawOnChartArea: false },
                },
            },
            plugins: {
                legend: {
                    position: 'top',
                    labels: { color: '#999', font: { size: 12 }, boxWidth: 24, padding: 16 }
                },
                tooltip: {
                    backgroundColor: '#1a1a1a',
                    borderColor: '#333',
                    borderWidth: 1,
                    titleColor: '#ccc',
                    bodyColor: '#999',
                }
            }
        }
    });
}
</script>
</body>
</html>
